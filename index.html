<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>家庭三年藍圖</title>
<style>
:root{
  --black:#000; --white:#fff; --ink:#000; --muted:#5f5f58; --line:#d9d9cf; --sand:#f5f5ef;
  --purple:#a100ff; --purple-mid:#7500c0; --purple-deep:#460073; --purple-on-black:#c266ff;
  --font:"Graphik","Helvetica Neue","Noto Sans TC","Microsoft JhengHei","PingFang TC",Arial,system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
body{background:var(--white);color:var(--ink);font-family:var(--font);line-height:1.75;-webkit-font-smoothing:antialiased;overflow-x:clip}
:focus-visible{outline:2px solid var(--purple);outline-offset:2px}

/* ---------- 登入 ---------- */
.login{min-height:100vh;display:grid;grid-template-columns:1.25fr 1fr;background:var(--black)}
.login-art{color:var(--white);padding:clamp(32px,6vw,88px);display:flex;flex-direction:column;justify-content:flex-end}
.login-art .mark{font-size:clamp(90px,16vw,220px);line-height:1;color:var(--purple);font-weight:300;margin-bottom:20px}
.login-art h1{font-size:clamp(34px,5vw,64px);line-height:1.15;font-weight:700;letter-spacing:-.015em}
.login-form{background:var(--white);padding:clamp(32px,5vw,72px);display:flex;flex-direction:column;justify-content:center}
.login-form h2{font-size:26px;font-weight:700;margin-bottom:28px}
.login-form label{display:block;font-size:13px;font-weight:600;margin-bottom:6px}
.login-form input{width:100%;font:inherit;font-size:16px;padding:12px 2px;border:0;border-bottom:2px solid var(--black);border-radius:0;background:none;margin-bottom:26px}
.login-form input:focus{outline:0;border-bottom-color:var(--purple)}
.btn{font:inherit;font-weight:600;font-size:15px;background:var(--purple);color:var(--white);border:0;border-radius:0;padding:14px 26px;cursor:pointer;align-self:flex-start}
.btn:hover{background:var(--purple-mid)}
.btn:disabled{opacity:.55;cursor:wait}
.err{color:var(--purple-mid);font-size:14px;font-weight:600;min-height:24px;margin-top:14px}

/* ---------- 頂部 ---------- */
.topbar{position:sticky;top:0;z-index:50;background:var(--white);border-bottom:1px solid var(--black)}
.topbar-inner{max-width:1180px;margin:0 auto;padding:0 24px;display:flex;align-items:stretch;gap:28px}
.brand{display:flex;align-items:center;font-size:16px;font-weight:700;white-space:nowrap}
.brand i{font-style:normal;color:var(--purple);margin-left:6px;font-size:20px}
.tabs{display:flex;flex:1;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;border:0;background:none;font:inherit;font-size:15px;font-weight:500;padding:18px 16px;cursor:pointer;border-bottom:4px solid transparent;white-space:nowrap}
.tab:hover{color:var(--purple-mid)}
.tab.on{font-weight:700;border-bottom-color:var(--purple)}
.logout{flex:none;border:0;background:none;font:inherit;font-size:13px;color:var(--muted);cursor:pointer;white-space:nowrap}
.logout:hover{color:var(--ink);text-decoration:underline}

/* ---------- 版面 ---------- */
main{max-width:1180px;margin:0 auto;padding:0 24px 90px}
.page{display:none}
.page.on{display:block;animation:fade .3s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
@media(prefers-reduced-motion:reduce){.page.on{animation:none}}

.hero{position:relative;isolation:isolate;color:var(--white);padding:72px 240px 64px 0;margin-bottom:48px}
.hero::before{content:"";position:absolute;z-index:-1;top:0;bottom:0;left:calc(50% - 50vw);right:calc(50% - 50vw);background:var(--black)}
.hero::after{content:">";position:absolute;right:0;bottom:24px;font-size:240px;line-height:1;font-weight:300;color:var(--purple)}
.eyebrow{font-size:13px;font-weight:600;color:var(--purple-on-black);margin-bottom:14px}
.hero h2{font-size:clamp(32px,5.2vw,60px);font-weight:700;line-height:1.18;letter-spacing:-.015em}
.hero .lede{margin-top:20px;font-size:16px;color:#e6e6dc;max-width:62ch}
.flag{display:inline-block;font-size:12px;font-weight:600;padding:3px 10px;border:1px solid var(--white);margin-bottom:16px}

section{margin-bottom:60px;border-top:1px solid var(--black);padding-top:24px}
h3{font-size:clamp(22px,2.6vw,30px);font-weight:700;line-height:1.3;margin-bottom:10px;letter-spacing:-.01em}
h3 .num{color:var(--purple);margin-right:12px}
.sec-note{font-size:15px;color:var(--muted);margin-bottom:24px;max-width:70ch}

/* ---------- 元件 ---------- */
.big-callout{background:var(--purple);color:var(--white);padding:36px 40px;margin:28px 0 48px}
section .big-callout{margin-bottom:24px}
.big-callout .k{font-size:13px;font-weight:600;margin-bottom:10px}
.big-callout .answer{font-size:clamp(26px,4vw,44px);font-weight:700;line-height:1.25;letter-spacing:-.01em}
.big-callout p{margin-top:14px;font-size:15px;max-width:64ch}

.grid{display:grid;gap:20px}
.g2{grid-template-columns:repeat(2,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}

.metric{padding:20px 22px 22px;background:var(--sand);border-top:4px solid var(--black)}
.metric.coral{border-top-color:var(--purple)}
.metric.amber{border-top-color:var(--purple-deep)}
.metric.green{border-top-color:var(--black)}
.metric.teal{border-top-color:var(--muted)}
.metric .y{font-size:13px;font-weight:600;color:var(--muted)}
.metric .v{font-size:24px;font-weight:700;margin:6px 0 8px;line-height:1.3}
.metric p{font-size:14px;color:#2c2c28;line-height:1.7}

.card{padding:22px 24px;border:1px solid var(--line);background:var(--white)}
.card h4{font-size:17px;font-weight:700;margin-bottom:12px}
.tag{display:inline-block;font-size:12px;font-weight:600;padding:1px 8px;margin-left:8px;vertical-align:2px;border:1px solid currentColor;color:var(--muted)}
.tag.c{color:var(--purple-mid)}

.list{list-style:none}
.list li{position:relative;padding-left:20px;margin-bottom:9px;font-size:15px}
.list li::before{content:">";position:absolute;left:0;top:0;color:var(--purple);font-weight:700}
.list b{font-weight:700}

.table-wrap{overflow-x:auto;border-top:2px solid var(--black)}
table{width:100%;border-collapse:collapse;font-size:15px;min-width:680px}
th{text-align:left;font-weight:700;padding:12px 16px 12px 0;border-bottom:1px solid var(--black);white-space:nowrap;font-size:14px}
td{padding:14px 16px 14px 0;border-bottom:1px solid var(--line);vertical-align:top;line-height:1.65}
tbody tr:hover{background:var(--sand)}
td.yr{font-weight:700;font-size:18px;white-space:nowrap}
td.concl{font-weight:700}
td:first-child{min-width:4.5em}
b.hl{color:var(--purple-mid)}

.timeline{position:relative;padding-left:80px}
.timeline::before{content:"";position:absolute;left:27px;top:8px;bottom:8px;width:1px;background:var(--black)}
.step{position:relative;margin-bottom:32px}
.step::before{content:attr(data-y);position:absolute;left:-80px;top:0;width:56px;padding:3px 0;text-align:center;background:var(--black);color:var(--white);font-size:13px;font-weight:700}
.step.a::before{background:var(--purple-deep)}
.step.c::before{background:var(--purple)}
.step h4{font-size:18px;font-weight:700;margin-bottom:10px;line-height:1.4}
.step .who{font-size:15px;margin-bottom:6px;display:grid;grid-template-columns:52px 1fr;gap:8px}
.step .who b{color:var(--purple-mid);font-weight:700}

.formula{background:var(--sand);border-left:4px solid var(--purple);padding:16px 20px;font-size:15px;margin:20px 0 0}
.warn{background:var(--black);color:var(--white);padding:18px 22px;font-size:15px;margin:20px 0 0}
footer{border-top:1px solid var(--black);padding-top:18px;font-size:13px;color:var(--muted);display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}
.state{padding:80px 0;font-size:16px;color:var(--muted)}

/* ---------- 圖 ---------- */
.new{font-size:11px;font-weight:700;font-style:normal;color:var(--white);background:var(--purple);padding:1px 6px;margin-left:6px;white-space:nowrap;vertical-align:1px}
.fig-cap{font-size:13px;color:var(--muted);margin-top:10px;line-height:1.6}
.fig-title{font-size:15px;font-weight:700;margin-bottom:10px}

.rhythm{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin:28px 0 48px}
.rhythm>div{color:var(--white);background:var(--black);padding:22px 44px 24px 24px;clip-path:polygon(0 0,calc(100% - 22px) 0,100% 50%,calc(100% - 22px) 100%,0 100%)}
.rhythm>div:nth-child(2){background:var(--purple-deep)}
.rhythm>div:nth-child(3){background:var(--purple)}
.rhythm .yr{font-size:14px;font-weight:600}
.rhythm .word{font-size:clamp(44px,6vw,72px);font-weight:700;line-height:1.15}
.rhythm p{font-size:14px;line-height:1.6;margin-top:6px}
.rhythm .new{background:var(--white);color:var(--purple-mid)}

.gantt-axis{display:grid;grid-template-columns:72px 1fr 1fr 1fr;font-size:13px;font-weight:700;margin-bottom:6px}
.gantt-axis span{padding-left:4px;border-left:1px solid var(--black)}
.gantt-row{display:grid;grid-template-columns:72px 1fr;margin-bottom:4px;align-items:center;font-size:14px;font-weight:600}
.track{display:flex;gap:2px;height:32px}
.track span{background:#e6e6dc;font-size:12.5px;font-weight:500;display:flex;align-items:center;padding:0 6px;white-space:nowrap;overflow:hidden}
.track span.f{background:var(--purple);color:var(--white);font-weight:700}

.palace{display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:minmax(96px,auto);gap:1px;background:var(--line);border:1px solid var(--line)}
.pl{background:var(--white);padding:8px;font-size:12.5px;line-height:1.45;position:relative}
.pl b{display:block;font-size:13.5px}
.pl i{position:absolute;top:8px;right:8px;font-style:normal;color:var(--muted);font-size:12px}
.pl span{display:block}
.pl em{display:inline-block;font-style:normal;font-size:11px;font-weight:700;color:var(--white);background:var(--purple);padding:0 5px;margin-top:4px}
.pl em.d{background:var(--black)}
.pl.ming b{color:var(--purple-mid)}
.pl.hot{background:#f7efff}
.si{grid-area:1/1}.wu{grid-area:1/2}.wei{grid-area:1/3}.shen{grid-area:1/4}
.chen{grid-area:2/1}.you{grid-area:2/4}.mao{grid-area:3/1}.xu{grid-area:3/4}
.yin{grid-area:4/1}.chou{grid-area:4/2}.zi{grid-area:4/3}.hai{grid-area:4/4}
.pl.center{grid-area:2/2/4/4;background:var(--sand);display:flex;flex-direction:column;justify-content:center;text-align:center;font-size:13px;gap:2px;padding:10px}
.pl.center b{font-size:16px}

.wx-key{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:14px}
.wx-key span,.wx-row span{font-size:13px;font-weight:600;padding:6px 10px;text-align:center}
.xi{background:var(--purple);color:var(--white)}
.ji{background:var(--black);color:var(--white)}
.ping{background:#e6e6dc;color:var(--black)}
.wx-row{display:grid;grid-template-columns:76px 1fr 1fr;gap:4px;align-items:center;margin-bottom:4px;font-size:14px;font-weight:700}

.rank>div{background:var(--sand);border-left:4px solid var(--purple);padding:12px 16px;margin-bottom:6px;font-size:14px}
.rank b{display:block;font-size:16px}
.rank>div:nth-child(2){width:92%;border-left-color:var(--purple-mid)}
.rank>div:nth-child(3){width:84%;border-left-color:var(--purple-deep)}
.rank>div:nth-child(4){width:76%;border-left-color:var(--black)}

@media(max-width:900px){
  .g3{grid-template-columns:repeat(2,1fr)}
  .login{grid-template-columns:1fr;grid-template-rows:auto 1fr}
  .login-art{justify-content:flex-start}
  .login-art .mark{display:none}
  .hero{padding:48px 0 44px}
  .hero::after{display:none}
  .big-callout{padding:26px 22px}
}
@media(max-width:600px){
  main{padding:0 16px 70px}
  .topbar-inner{padding:0 16px;gap:10px;flex-wrap:wrap;justify-content:space-between}
  .brand{padding-top:10px}
  .tabs{order:3;flex-basis:100%}
  .logout{padding-top:10px}
  .tab{padding:10px 12px}
  .g2,.g3{grid-template-columns:1fr}
  .timeline{padding-left:0}
  .timeline::before{display:none}
  .step{padding-top:34px}
  .step::before{left:0}
  .rhythm{grid-template-columns:1fr}
  .rhythm>div{clip-path:none;padding:18px 20px}
  .gantt-axis{grid-template-columns:52px 1fr 1fr 1fr}
  .gantt-row{grid-template-columns:52px 1fr;font-size:13px}
  .track span{font-size:11px;padding:0 3px}
  .palace{grid-auto-rows:minmax(104px,auto)}
  .pl{padding:6px;font-size:11.5px}
  .pl i{top:6px;right:6px}
  .rank>div:nth-child(n){width:100%}
}
</style>
</head>
<body>

<div class="login" id="login" hidden>
  <div class="login-art">
    <div class="mark" aria-hidden="true">&gt;</div>
    <h1>家庭三年藍圖</h1>
  </div>
  <form class="login-form" id="loginForm">
    <h2>登入</h2>
    <label for="user">帳號</label>
    <input id="user" autocomplete="username" autocapitalize="none" spellcheck="false" required>
    <label for="pass">密碼</label>
    <input id="pass" type="password" autocomplete="current-password" required>
    <button class="btn" id="loginBtn">登入 &gt;</button>
    <div class="err" id="err" role="alert"></div>
  </form>
</div>

<div id="app" hidden>
  <div class="topbar">
    <div class="topbar-inner">
      <div class="brand">家庭三年藍圖<i aria-hidden="true">&gt;</i></div>
      <nav class="tabs" id="tabs"></nav>
      <button class="logout" id="logout">登出</button>
    </div>
  </div>
  <main id="content"><div class="state">載入中…</div></main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
const SB_URL='https://cowljafosekwvxithwjd.supabase.co';
const SB_KEY='sb_publishable_YP57cbbDJSP7-PvBgtKivA_25uDcp5n';
const LOGIN_DOMAIN='@family-fortune.example'; // 登入帳號對應 Supabase Auth 的 email
const sb=supabase.createClient(SB_URL,SB_KEY);
const $=id=>document.getElementById(id);

function showLogin(msg){
  $('app').hidden=true;
  $('login').hidden=false;
  $('content').innerHTML='<div class="state">載入中…</div>';
  $('tabs').innerHTML='';
  $('err').textContent=msg||'';
}

function route(id){
  const pages=[...document.querySelectorAll('.page')];
  if(!pages.some(p=>p.id===id)) id=pages[0].id;
  pages.forEach(p=>p.classList.toggle('on',p.id===id));
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('on',t.dataset.t===id));
  if(location.hash.slice(1)!==id) history.replaceState(null,'','#'+id);
  window.scrollTo(0,0);
}

async function showApp(){
  $('login').hidden=true;
  $('app').hidden=false;
  const {data,error}=await sb.from('family_fortune_pages').select('slug,title,html').order('sort');
  if(error) return showLogin('資料讀取失敗，請重新登入');
  if(!data.length){
    await sb.auth.signOut();
    return showLogin('此帳號沒有閱讀權限');
  }
  $('content').innerHTML=data.map(p=>`<div class="page" id="${p.slug}">${p.html}</div>`).join('');
  $('tabs').innerHTML=data.map(p=>`<button class="tab" data-t="${p.slug}">${p.title}</button>`).join('');
  document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>route(t.dataset.t)));
  route(location.hash.slice(1));
}

$('loginForm').addEventListener('submit',async e=>{
  e.preventDefault();
  const u=$('user').value.trim().toLowerCase();
  $('err').textContent='';
  $('loginBtn').disabled=true;
  const {error}=await sb.auth.signInWithPassword({email:u.includes('@')?u:u+LOGIN_DOMAIN,password:$('pass').value});
  $('loginBtn').disabled=false;
  $('pass').value='';
  if(error) return showLogin(error.status===400?'帳號或密碼不正確':'連線失敗，請稍後再試');
  showApp();
});

$('logout').addEventListener('click',async()=>{
  await sb.auth.signOut();
  history.replaceState(null,'',location.pathname);
  showLogin();
});

window.addEventListener('hashchange',()=>{ if(document.querySelector('.page')) route(location.hash.slice(1)); });
sb.auth.getSession().then(({data})=>data.session?showApp():showLogin());
</script>
</body>
</html>
